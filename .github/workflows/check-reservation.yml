name: Check reservation availability

on:
  workflow_dispatch:
  schedule:
    # GitHub may heavily delay very frequent scheduled workflows. Each scheduled
    # job stays alive and checks every five minutes, while this schedule starts
    # a replacement often enough to avoid gaps when a launch is delayed.
    - cron: '17 */3 * * *'

concurrency:
  group: reservation-cancel-watch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore notification state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: reservation-state-${{ github.run_id }}
          restore-keys: |
            reservation-state-

      - name: Install dependencies
        run: npm ci

      - name: Check reservation
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EBICA_URL: https://booking.ebica.jp/webrsv/plan/e014001307/22192/158405
          TARGET_DATE: '2026-10-03'
          TARGET_TIMES: 11:00,11:15,11:30,11:45,12:00
          STATE_FILE: .state/last-status.json
          CHECK_ITERATIONS: ${{ github.event_name == 'schedule' && '70' || '1' }}
        shell: bash
        run: |
          failures=0
          for ((iteration = 1; iteration <= CHECK_ITERATIONS; iteration++)); do
            echo "Reservation check ${iteration}/${CHECK_ITERATIONS}"
            if ! npm run check; then
              failures=$((failures + 1))
            fi

            if ((iteration < CHECK_ITERATIONS)); then
              sleep 300
            fi
          done

          if ((failures == CHECK_ITERATIONS)); then
            echo "Every reservation check failed."
            exit 1
          fi

      - name: Save notification state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: reservation-state-${{ github.run_id }}
